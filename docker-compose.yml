services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); } quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  server:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/stationery_pos?replicaSet=rs0
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./frontend/frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - ./frontend/frontend:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongo_data:
  uploads_data: